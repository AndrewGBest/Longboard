# Publishes a GitHub release when a version tag (v1.2.3) is pushed: the same
# checks and packages as "Build packages", for both kinds of processor, then
# one release with all the packages attached. Copies of Longboard look at the
# latest release for new versions (src/shared/update.ts), so a tag is pushed
# only when a release is meant.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    name: linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: The tag must be the version in package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run check
      - run: npx electron-builder --linux --${{ matrix.arch }} --publish never
      # The end-to-end checks run against the package that was just built,
      # not the source tree, so what is tested is what is shipped.
      - name: End-to-end on the package
        run: LONGBOARD_APP="$(ls -d release/linux*-unpacked)/longboard" xvfb-run -a node test/e2e/run.mjs
      # The Flatpak bundle is built separately: it needs flatpak-builder and
      # the runtime it is built against, which the other packages do not. It
      # is built on a machine of the processor it is for.
      - name: Install Flatpak tooling and runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08
      - name: Build the Flatpak bundle
        run: npx electron-builder --linux flatpak --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: longboard-linux-${{ matrix.arch }}
          path: |
            release/*.AppImage
            release/*.tar.gz
            release/*.flatpak
          if-no-files-found: error
          retention-days: 14

  # Only when every package was built and every check passed, on both.
  publish:
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the attestation: a signed statement, kept by GitHub, that these
      # files were built by this workflow from this commit.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: List the files' SHA-256 sums
        run: cd release && sha256sum Longboard-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Attest where the files were built
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l release/
          sh scripts/release-body.sh > release-body.md
          gh release create "$GITHUB_REF_NAME" release/*.AppImage release/*.tar.gz release/*.flatpak release/SHA256SUMS.txt \
            --title "Longboard ${GITHUB_REF_NAME#v}" --notes-file release-body.md
