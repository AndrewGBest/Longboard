name: Something in Longboard itself is wrong
description: Home, the menu, the on-screen keyboard, Settings, packages, updates, controllers.
labels: ['bug']
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected.
    validations:
      required: true
  - type: textarea
    id: again
    attributes:
      label: How to make it happen again
      description: The fewest steps you know of. "It happens sometimes" is still worth saying.
  - type: input
    id: version
    attributes:
      label: Longboard version
      placeholder: 0.3.27
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - AppImage
        - Flatpak
        - tar.gz
        - Built from source
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and system
      description: The machine (and whether it is Intel/AMD or ARM), its Linux system and desktop, and what you drive it with.
  - type: textarea
    id: terminal
    attributes:
      label: What the terminal said (optional)
      description: Run Longboard from a terminal and paste what it prints. It never prints passwords, but read it before pasting.
      render: text
