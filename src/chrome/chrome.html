<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Longboard's own screens. Nothing here loads from anywhere: no scripts, no
     fonts, and no pictures except ones the shell hands over inside the page's
     state (a site's icon). The screens are drawn by the preload in its isolated world. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:">
<title>Longboard</title>
<style>
  /*
   * The design system, in one place (DESIGN.md section 11).
   * Sizes are in vh so that everything is the same share of the screen on
   * any TV, and so the panel is the same whether it lies over Home or is a
   * view of its own beside a website. Nothing smaller than 2.2vh: that is 24
   * pixels on a 1080-line screen.
   */
  :root {
    --bg: #0b0e13;
    --surface: #141920;
    --raised: #1d242e;
    --raised-2: #283140;
    --line: #2b3441;
    --text: #f1f3f6;
    --text-2: #b7bfcb;
    --text-3: #8d97a6;
    --accent: #5fd6c4;
    --accent-ink: #062521;
    --warn: #f2bd6b;
    --danger: #ff8d85;
    --focus: #f1f3f6;
    --focus-ink: #0b0e13;
    --focus-ink-2: #3b4452;
    --r-s: 1vh;
    --r-m: 1.6vh;
    --r-l: 2.4vh;
    --t-display: 600 5.4vh/1.1 system-ui, sans-serif;
    --t-title: 700 3.7vh/1.2 system-ui, sans-serif;
    --t-body: 400 2.9vh/1.3 system-ui, sans-serif;
    --t-small: 400 2.4vh/1.35 system-ui, sans-serif;
    --t-label: 600 2.2vh/1.2 system-ui, sans-serif;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: var(--t-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  * { cursor: none; box-sizing: border-box; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  svg.ic { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* The highlight. The layer draws its ring round whatever has it; on
     Longboard's own screens the thing itself also turns light, so where the
     highlight is can be seen from across a room. */
  [data-longboard-focus] { outline: none; }
  button { transition: background-color .12s ease-out, color .12s ease-out, transform .12s ease-out; }
  button[data-longboard-focus], input[data-longboard-focus] { background: var(--focus) !important; color: var(--focus-ink) !important; }
  #panel button[data-longboard-focus] .sub, #panel button[data-longboard-focus] .value, button[data-longboard-focus] .sub { color: var(--focus-ink-2); }
  button[data-longboard-focus] .switch { background: #aab3c0; }
  button[data-longboard-focus] .switch.on { background: #0f8f7e; }
  input[data-longboard-focus]::placeholder { color: var(--focus-ink-2); }

  /* ---- Home. 5% is kept clear at every edge for TVs that cut the picture off. ---- */
  #home { height: 100%; padding: 5vh 5vw 4vh; display: flex; flex-direction: column; gap: 3vh; overflow-y: auto; scroll-padding: 12vh 0; }
  #home > * { flex: none; }
  #top { display: flex; align-items: center; gap: 1.6vh; }
  #top h1 { margin: 0; font: 700 3.6vh/1 system-ui, sans-serif; letter-spacing: .01em; }
  #top .logo { width: 5.2vh; height: 5.2vh; }
  #top .badge { margin-left: 1vh; }
  #home-menu { margin-left: 2.4vh; display: inline-flex; align-items: center; gap: 1vh; padding: 1.2vh 2.2vh; border: 0; border-radius: 10vh; background: var(--raised); color: var(--text); font: var(--t-label); }
  #clock { margin-left: auto; text-align: right; font: 600 3.6vh/1 system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  #clock small { display: block; margin-top: .6vh; font: var(--t-small); color: var(--text-2); }
  .badge { display: inline-flex; align-items: center; gap: .8vh; padding: .7vh 1.6vh; border-radius: 10vh; background: var(--raised); color: var(--text-2); font: var(--t-label); }
  .badge.private { background: #3b3320; color: var(--warn); }

  .field { display: flex; align-items: center; gap: 1.8vh; width: 100%; height: 9.4vh; padding: 0 3vh; border: 0; border-radius: 10vh; background: var(--raised); text-align: left; font-size: 3.2vh; color: var(--text-2); }
  .field input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; color: var(--text); }
  .field { border-radius: var(--r-m); }
  .field.typing { position: relative; padding: 0; background: none; color: var(--text); }
  .field.typing svg.ic { position: absolute; left: 3vh; pointer-events: none; }
  .field.typing input { padding: 0 3vh 0 8.2vh; border-radius: var(--r-m); background: var(--raised); box-shadow: inset 0 0 0 .35vh var(--accent); }
  .field input[data-longboard-focus] { background: var(--raised) !important; color: var(--text) !important; }
  .field input::placeholder { color: var(--text-3); }

  #suggestions { display: flex; flex-direction: column; gap: .8vh; }
  #suggestions:empty { display: none; }
  #suggestions button { display: flex; align-items: center; gap: 1.6vh; width: 100%; min-height: 7vh; padding: 1vh 3vh; border: 0; border-radius: var(--r-m); background: var(--raised); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #resume { display: flex; align-items: center; gap: 2vh; width: 100%; min-height: 9.4vh; padding: 1.4vh 3vh; border: 0; border-radius: var(--r-m); background: var(--raised); text-align: left; }
  #resume .text { flex: 1; min-width: 0; }
  #resume .label, #resume .sub { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #resume .label { font-weight: 600; }
  #resume .sub { font: var(--t-small); color: var(--text-2); }

  h2 { margin: 1vh 0 -1vh; font: var(--t-label); color: var(--text-3); text-transform: uppercase; letter-spacing: .1em; }
  .tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2.4vh; }
  .tile { display: flex; flex-direction: column; justify-content: flex-end; gap: .3vh; height: 22vh; padding: 2vh; border: 0; border-radius: var(--r-l); background: var(--raised); text-align: left; overflow: hidden; }
  .tile[data-longboard-focus] { transform: scale(1.04); }
  .mono { display: block; flex: none; width: 6.4vh; height: 6.4vh; border-radius: 1.4vh; background: #2c6f72; color: #fff; font: 700 3.4vh/6.4vh system-ui, sans-serif; text-align: center; text-transform: uppercase; }
  img.mono { object-fit: contain; background: #fff; padding: .6vh; }
  .tile .mono { width: 7.6vh; height: 7.6vh; border-radius: 1.8vh; margin-bottom: auto; font-size: 4.2vh; line-height: 7.6vh; }
  .tile .site { font-weight: 600; line-height: 1.2; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
  .tile .sub { font: var(--t-small); color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 3.1vh; }
  .tile { position: relative; }
  .tile .mark { position: absolute; top: 2vh; right: 2vh; padding: .4vh 1.1vh; border-radius: 10vh; background: rgba(95, 214, 196, .16); color: var(--accent); font: var(--t-label); }
  .tile .mark:empty { display: none; }
  .tile[data-longboard-focus] .mark { background: #0f8f7e; color: #fff; }

  #welcome { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2.4vh; }
  #welcome div { padding: 3vh; border-radius: var(--r-l); background: var(--surface); }
  #welcome svg.ic { width: 4.4vh; height: 4.4vh; color: var(--accent); }
  #welcome b { display: block; margin: 1.4vh 0 .6vh; font-weight: 600; }
  #welcome span { font: var(--t-small); color: var(--text-2); }
  #welcome-title { margin: 2vh 0 -1vh; font: var(--t-title); }

  kbd { display: inline-block; min-width: 3.6vh; padding: .3vh 1.1vh; border-radius: .8vh; background: var(--raised); color: var(--text-2); font: var(--t-label); text-align: center; }

  /* ---- The panel: a strip down the right. Over Home it lies on top of it;
     over a website the view itself is the strip, so the panel fills it. ---- */
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 38vw; padding: 5vh 3.4vh 4vh; display: flex; flex-direction: column; gap: 1.1vh; background: var(--surface); box-shadow: -1vh 0 5vh rgba(0, 0, 0, .55); overflow-y: auto; scroll-padding: 10vh 0; animation: panel-in .16s ease-out; }
  #panel.still { animation: none; }
  @keyframes panel-in { from { transform: translateX(3vh); opacity: 0; } }
  body.strip #panel { width: 100%; box-shadow: none; border-left: .2vh solid var(--line); }
  #panel > * { flex: none; }
  #panel .list { display: flex; flex-direction: column; gap: 1.1vh; }
  #panel h1 { margin: 0 0 .6vh; font: var(--t-title); display: flex; align-items: center; gap: 1.4vh; }
  #panel .where { margin: 0 0 1vh; color: var(--text-2); font: var(--t-small); overflow-wrap: anywhere; }
  #panel .where.warn, #panel .warn { color: var(--warn); }
  #panel p { margin: 0 0 1vh; color: var(--text-2); font: var(--t-small); }
  #panel p.lead { color: var(--text); font: var(--t-body); }
  #panel h2 { margin: 2vh 0 .2vh; }
  #panel .site { display: flex; align-items: center; gap: 1.6vh; margin: 0 0 1.4vh; }
  #panel .site .text { min-width: 0; }
  #panel .site b, #panel .site .text span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #panel .site b { font-weight: 600; }
  #panel .site .text > span { display: flex; align-items: center; gap: .8vh; font: var(--t-small); color: var(--text-2); }
  #panel .site .text > span.warn { color: var(--warn); }

  #panel button, #panel input { width: 100%; min-height: 7.4vh; padding: 1.2vh 2.2vh; border: 0; border-radius: var(--r-m); background: var(--raised); text-align: left; }
  #panel input { outline: none; }
  #panel input::placeholder { color: var(--text-3); }
  #panel button:disabled { color: #5d6675; background: #171c24; }
  #panel button.row { display: flex; align-items: center; gap: 1.6vh; }
  #panel .row .text { flex: 1; min-width: 0; }
  #panel .row .label { display: block; }
  #panel .row .sub { display: block; margin-top: .2vh; font: var(--t-small); color: var(--text-2); }
  #panel .row .value { flex: none; max-width: 48%; text-align: right; color: var(--text-2); font: var(--t-small); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #panel .row.quiet { background: none; color: var(--text-2); }
  #panel .row.danger .label { color: var(--danger); }
  #panel .row.danger[data-longboard-focus] .label { color: #a3261d; }
  #panel .row.chosen { box-shadow: inset .5vh 0 0 var(--accent); }
  .switch { flex: none; position: relative; width: 6.2vh; height: 3.4vh; border-radius: 10vh; background: #414b5b; transition: background-color .12s; }
  .switch::after { content: ''; position: absolute; top: .45vh; left: .45vh; width: 2.5vh; height: 2.5vh; border-radius: 50%; background: #fff; transition: transform .12s ease-out; }
  .switch.on { background: #1ba896; }
  .switch.on::after { transform: translateX(2.8vh); }

  #panel .pair { display: flex; gap: 1.1vh; }
  #panel .pair button { width: auto; flex: 1 1 0; min-width: 0; padding: 0 1vh; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #panel .pair button.grow { flex: 5 1 0; text-align: left; padding: 1.2vh 2.2vh; }
  #panel .nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6vh; min-height: 10.5vh; font: var(--t-small); }
  #panel .nav svg.ic { width: 3.6vh; height: 3.6vh; }
  #panel .pair button:not(.row):not(:empty) { display: inline-flex; align-items: center; justify-content: center; gap: 1vh; }
  #panel .pair.nav button { flex-direction: column; gap: .6vh; }

  #panel dl { display: grid; grid-template-columns: auto 1fr; gap: 1vh 2vh; margin: 1vh 0 1.6vh; font: var(--t-small); align-items: baseline; }
  #panel dt { color: var(--text); font-weight: 600; }
  #panel dd { margin: 0; color: var(--text-2); }
  #panel .bar { height: .8vh; margin: -.4vh 0 1vh; border-radius: 1vh; background: var(--raised); overflow: hidden; }
  #panel .bar i { display: block; height: 100%; background: var(--accent); }

  #scan-code { display: block; width: 62%; margin: 1vh auto 2vh; border-radius: 1.2vh; }
  #panel .pinpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.1vh; }
  #panel .pinpad button { width: auto; min-width: 0; min-height: 9vh; padding: 0; text-align: center; font-size: 3.4vh; }
  #panel .pinpad button.word { font: var(--t-small); }
  #panel #pin-dots { display: flex; justify-content: center; gap: 2.4vh; margin: 2vh 0 2.4vh; }
  #pin-dots i { width: 2.6vh; height: 2.6vh; border-radius: 50%; box-shadow: inset 0 0 0 .3vh var(--text-3); }
  #pin-dots i.in { background: var(--accent); box-shadow: none; }

  /* Reader view: the whole screen, a column of words kept clear of the edges. */
  #panel.reader { width: 100%; padding: 0 0 10vh; background: var(--bg); box-shadow: none; display: block; animation: none; }
  #panel.reader #reader-bar { position: sticky; top: 0; z-index: 1; margin: 0 0 4vh; padding: 3vh 5vw 2vh; background: var(--bg); border-bottom: .2vh solid var(--line); }
  #panel.reader #reader-bar button { flex: 0 0 auto; padding: 0 3vh; }
  #panel.reader #reader-bar .spacer { flex: 1; }
  #reader-text { max-width: 34em; margin: 0 auto; padding: 0 5vw; line-height: 1.6; color: #e7eaef; overflow-wrap: anywhere; font-family: Georgia, 'Times New Roman', serif; }
  #reader-text h1 { display: block; font: 700 1.6em/1.2 system-ui, sans-serif; margin: 0 0 .3em; color: var(--text); }
  #reader-text h2 { font: 700 1.2em/1.25 system-ui, sans-serif; margin: 1.4em 0 .5em; color: var(--text); text-transform: none; letter-spacing: 0; }
  #reader-text p, #reader-text li, #reader-text blockquote, #reader-text pre { font-size: 1em; line-height: inherit; font-family: inherit; margin: 0 0 1em; color: #e7eaef; }
  #reader-text .where { font: 400 .7em/1.3 system-ui, sans-serif; color: var(--text-3); margin-bottom: 2em; }
  #reader-text li { display: list-item; margin-left: 1.2em; }
  #reader-text blockquote { border-left: .2em solid var(--accent); padding-left: .8em; color: var(--text-2); font-style: italic; }
  #reader-text pre { font: .8em/1.45 ui-monospace, monospace; white-space: pre-wrap; background: var(--surface); padding: .8em; border-radius: var(--r-m); }

  @media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body></body>
</html>
