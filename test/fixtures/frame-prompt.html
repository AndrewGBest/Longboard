<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Longboard fixture: a prompt that is a frame over the whole page</title>
<!-- A made-up page whose sign-in prompt is a frame from another origin laid
     over everything, as services that sign in through their own site do. -->
<style>
  body { margin: 0; padding: 24px 32px; background: #fff; color: #222; font: 16px/1.5 system-ui, sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #eef; }
</style>
</head>
<body>
<a href="#one" id="one">A link under the prompt</a>
<div role="dialog" aria-modal="true" style="position: fixed; inset: 0"><iframe id="frame" title="Prompt"></iframe></div>
<script>
  window.__frame = { messages: [] };
  window.addEventListener('message', (e) => window.__frame.messages.push(String(e.data)));
  document.getElementById('frame').src = `http://localhost:${location.port}/inner.html`;
</script>
</body>
</html>
