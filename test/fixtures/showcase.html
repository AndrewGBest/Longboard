<!doctype html>
<!-- An invented page for pictures of Longboard at work (test/scorecard/own-shots.mjs).
     Every word and shape here is made up for this project; nothing is taken from any website. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harbour: an invented streaming page</title>
<style>
  body { margin: 0; background: #10131a; color: #eef1f6; font: 22px/1.4 system-ui, sans-serif; }
  header { display: flex; gap: 14px; align-items: center; padding: 14px 64px; }
  header strong { font-size: 30px; margin-right: 28px; letter-spacing: 0.04em; }
  header a { color: #c9d1dd; text-decoration: none; padding: 10px 18px; border-radius: 999px; }
  header input { margin-left: auto; font: inherit; padding: 10px 18px; border-radius: 999px; border: 0; background: #1e2430; color: inherit; width: 170px; }
  .hero { margin: 8px 64px 0; height: 200px; border-radius: 22px; background: linear-gradient(120deg, #1d4e5a, #2e7d6f 55%, #e2a15a); display: flex; flex-direction: column; justify-content: flex-end; padding: 22px 30px; box-sizing: border-box; }
  .hero h1 { margin: 0 0 2px; font-size: 38px; }
  .hero p { margin: 0 0 12px; font-size: 18px; max-width: 34em; color: #e6f1ee; }
  .hero button { font: inherit; font-weight: 600; padding: 8px 24px; border-radius: 12px; border: 0; margin-right: 12px; background: #fff; color: #10131a; }
  .hero button + button { background: rgba(16, 19, 26, 0.55); color: #fff; }
  h2 { margin: 20px 64px 10px; font-size: 22px; }
  .row { display: flex; gap: 18px; padding: 0 64px; }
  .row a { flex: 0 0 250px; height: 140px; border-radius: 16px; display: flex; align-items: flex-end; padding: 16px; box-sizing: border-box; color: #fff; text-decoration: none; font-weight: 600; }
  .a { background: linear-gradient(140deg, #35507a, #6a8fc2); } .b { background: linear-gradient(140deg, #7a3550, #c26a8a); }
  .c { background: linear-gradient(140deg, #4f7a35, #9ac26a); } .d { background: linear-gradient(140deg, #7a6435, #c2a86a); }
  .e { background: linear-gradient(140deg, #4a357a, #8a6ac2); } .f { background: linear-gradient(140deg, #2f6f73, #63b7b0); }
</style>
</head>
<body>
<header>
  <strong>HARBOUR</strong>
  <a href="#home">Home</a><a href="#films">Films</a><a href="#series">Series</a><a href="#live">Live</a>
  <input type="search" placeholder="Search" aria-label="Search">
</header>
<section class="hero">
  <h1>The Long Way Round</h1>
  <p>Two friends, one borrowed van and a coastline nobody has mapped properly.</p>
  <div><button>Play</button><button>More about it</button></div>
</section>
<h2>Carry on watching</h2>
<div class="row">
  <a class="a" href="#1">Tide Tables</a><a class="b" href="#2">Paper Lanterns</a><a class="c" href="#3">The Allotment</a>
  <a class="d" href="#4">Slow Trains</a><a class="e" href="#5">Night Ferry</a><a class="f" href="#6">Saltmarsh</a>
</div>

<div class="row">
  <a class="f" href="#7">Low Water</a><a class="e" href="#8">Small Hours</a><a class="d" href="#9">Field Notes</a>
  <a class="c" href="#10">Greenhouse</a><a class="b" href="#11">Second Post</a><a class="a" href="#12">North Light</a>
</div>
</body>
</html>
