<!doctype html>
<meta charset="utf-8">
<title>Longboard fixture: a search field with suggestions</title>
<!-- Invented layout. A top bar with a "skip" link parked above the page that shows itself when focused,
     a button, and a search field that is an ARIA combobox: the arrow keys mark a suggestion, Enter chooses it,
     and the list is drawn afresh whenever the field loses the cursor. -->
<style>
  body { margin: 0; font: 20px sans-serif; background: #111; color: #eee; }
  #bar { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: #222; }
  #skip { position: absolute; left: 16px; top: -1000px; width: 128px; height: 40px; }
  #skip:focus { left: 185px; top: 12px; }
  #logo { position: absolute; left: 56px; top: 0; width: 123px; height: 56px; }
  #q { position: absolute; left: 278px; top: 16px; width: 300px; height: 24px; box-sizing: border-box; }
  #go { position: absolute; left: 590px; top: 8px; width: 64px; height: 40px; }
  #list { position: absolute; left: 230px; top: 56px; width: 360px; background: #333; display: none; padding: 12px 0; }
  #list [role=option] { height: 32px; padding: 6px 24px; }
  #list [role=option].on { background: #555; }
  main { margin-top: 300px; padding: 0 56px; }
  main a { display: block; width: 300px; height: 40px; color: #9cf; }
</style>
<div id="bar">
  <button id="skip">Skip</button>
  <a id="logo" href="#top">Fixture</a>
  <input id="q" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="list">
  <button id="go">Go</button>
  <div id="list" role="listbox"></div>
</div>
<main>
  <a id="first" href="#first">First thing</a>
  <a id="second" href="#second">Second thing</a>
</main>
<script>
  const q = document.getElementById('q');
  const list = document.getElementById('list');
  const words = ['one', 'two', 'three'];
  let at = -1;
  window.__chosen = null;
  function draw() {
    list.replaceChildren(...words.map((w, i) => {
      const o = document.createElement('div');
      o.setAttribute('role', 'option');
      o.id = 'opt-' + i;
      const inner = document.createElement('span');
      inner.setAttribute('role', 'button');
      inner.tabIndex = 0;
      inner.textContent = q.value + ' ' + w;
      o.append(inner);
      if (i === at) o.className = 'on';
      return o;
    }));
    if (at >= 0) q.setAttribute('aria-activedescendant', 'opt-' + at); else q.removeAttribute('aria-activedescendant');
  }
  function open(on) {
    list.style.display = on ? 'block' : 'none';
    q.setAttribute('aria-expanded', String(on));
    if (!on) at = -1;
    draw();
  }
  q.addEventListener('input', () => open(q.value.length > 0));
  q.addEventListener('focus', () => { if (q.value) open(true); });
  // Losing the cursor draws the list afresh: whatever was pointed at inside it is gone.
  q.addEventListener('blur', () => { at = -1; draw(); });
  q.addEventListener('keydown', (e) => {
    if (q.getAttribute('aria-expanded') !== 'true') return;
    if (e.key === 'ArrowDown') { at = at + 1 >= words.length ? -1 : at + 1; draw(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { at = at < 0 ? words.length - 1 : at - 1; draw(); e.preventDefault(); }
    else if (e.key === 'Enter' && at >= 0) { window.__chosen = words[at]; open(false); e.preventDefault(); }
  });
</script>
