<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Longboard fixture: a long page with a big player in it</title>
<!-- A made-up page for testing. It imitates no real service. Tabs across the top, a player nearly as big as the
     window whose controls come up when the pointer moves, a button under it and a row of channels under that.
     The picture is drawn on a canvas. -->
<style>
  html, body { margin: 0; background: #111; color: #eee; font: 16px system-ui, sans-serif; }
  nav { height: 60px; padding: 20px; }
  nav a { color: #9cf; margin-right: 30px; }
  #player { position: relative; margin: 40px 2vw 0; width: 96vw; height: 92vh; background: #000; }
  #player video { width: 100%; height: 100%; }
  #controls { position: absolute; left: 0; right: 0; bottom: 20px; height: 50px; }
  #controls button { position: absolute; top: 0; width: 50px; height: 50px; }
  #pp { left: 30px; }
  #full { right: 30px; }
  #more { display: block; margin: 60px 2vw; width: 200px; height: 60px; }
  #channels { display: flex; gap: 20px; margin: 0 2vw 900px; }
  #channels button { width: 240px; height: 160px; }
</style>
</head>
<body>
<nav><a href="#live" id="tab-live">Live</a><a href="#schedule" id="tab-schedule">Schedule</a></nav>
<div id="player"><video id="v" playsinline></video></div>
<button id="more">More views</button>
<div id="channels"><button id="ch1">Channel 1</button><button id="ch2">Channel 2</button><button id="ch3">Channel 3</button></div>
<script>
  const state = (window.__pp = { space: 0, left: 0, right: 0, channel: 1, moves: 0 });
  const player = document.getElementById('player');
  const video = document.getElementById('v');
  const canvas = document.createElement('canvas');
  canvas.width = 320; canvas.height = 180;
  const ctx = canvas.getContext('2d');
  let frame = 0;
  setInterval(() => { ctx.fillStyle = `hsl(${frame++ % 360} 60% 30%)`; ctx.fillRect(0, 0, 320, 180); }, 100);
  video.srcObject = canvas.captureStream(10);
  video.muted = false;
  video.play();

  let controls = null;
  let hideTimer;
  const show = () => {
    if (!controls) {
      controls = document.createElement('div');
      controls.id = 'controls';
      controls.innerHTML = '<button id="pp">pp</button><button id="full">full</button>';
      player.append(controls);
    }
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => { controls?.remove(); controls = null; }, 1500);
  };
  player.addEventListener('mousemove', () => { state.moves++; show(); });
  window.addEventListener('keydown', (e) => {
    if (e.key === ' ') { state.space++; video.paused ? video.play() : video.pause(); }
    if (e.key === 'ArrowLeft') state.left++;
    if (e.key === 'ArrowRight') state.right++;
  });
  // Choosing a channel takes the page back up to the picture, as such pages do.
  for (const b of document.querySelectorAll('#channels button')) b.addEventListener('click', () => { state.channel = Number(b.id.slice(2)); window.scrollTo(0, 0); });
</script>
</body>
</html>
